kind = "web"
previewPath = "/"
title = "بصمة"
version = "1.0.0"
id = "artifacts/basmah"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23376

[services.development]
run = "pnpm --filter @workspace/basmah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/basmah", "run", "build" ]
publicDir = "artifacts/basmah/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23376"
BASE_PATH = "/"
